<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Taquaral</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#263344;background:#f5f6f8}button,input,select,textarea{font:inherit;border:1px solid #dce0e5;border-radius:8px;padding:10px;background:white}button{cursor:pointer}button.primary{background:#e96513;color:white;border:0}button:disabled{opacity:.5}h2,h3,p{margin:0}small{color:#697586}header{padding:16px 24px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:12px}#login{max-width:390px;margin:12vh auto;background:white;padding:32px;border-radius:16px;box-shadow:0 8px 40px #0001}form{display:grid;gap:12px}#login h2{color:#e96513;margin-bottom:20px}#layout{display:grid;grid-template-columns:210px 310px minmax(300px,1fr);height:calc(100dvh - 70px)}aside,section{background:white;border-right:1px solid #e2e5e9;min-width:0}aside{padding:18px;overflow:auto}aside button{display:block;width:100%;text-align:left;margin:5px 0;border:0}aside button.active{background:#fff0e5;color:#b94a00}#inbox{display:flex;flex-direction:column;overflow:hidden}#inbox>div:first-child{padding:18px;display:grid;gap:12px}#items{overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;border-radius:0;padding:16px}.item.active{background:#fff1e6}.item strong,.item small{display:block}.pill{display:inline-block;background:#fff0e5;color:#a74600;padding:4px 8px;border-radius:12px;margin:4px 4px 0 0;font-size:12px}#conversation{display:flex;flex-direction:column;overflow:hidden;background:#f7f8fa}#top{padding:16px;background:white;border-bottom:1px solid #ddd;display:grid;gap:8px}#actions{display:flex;gap:6px;flex-wrap:wrap}#history{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.bubble{padding:12px;border-radius:12px;background:white;max-width:85%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{align-self:flex-end;background:#ffe6d3}.bubble.note{background:#fff5c9;align-self:center}.bubble small{display:block;margin-bottom:5px}#compose{padding:14px;background:white;border-top:1px solid #ddd}textarea{resize:vertical;width:100%}#notice{padding:8px 24px;color:#a53d00;background:#fff4e8} [hidden]{display:none!important}@media(max-width:850px){#layout{grid-template-columns:130px 1fr; height:auto}#conversation{grid-column:1/-1;min-height:65vh}#items{max-height:35vh}aside{padding:8px}header{padding:12px}#history{min-height:200px;max-height:50vh}}</style></head><body><div id="notice" hidden role="status"></div><div id="login"><h2>Central Taquaral</h2><p style="margin-bottom:20px">Acesso exclusivo de consultores autorizados.</p><form id="loginForm" method="post" onsubmit="event.preventDefault()"><input id="email" type="email" placeholder="E-mail" required autocomplete="username"><input id="password" type="password" placeholder="Senha" required autocomplete="current-password"><button class="primary">Entrar</button></form></div><div id="app" hidden><header><div><strong style="color:#e96513;font-size:20px">Central Taquaral</strong><br><small id="who"></small></div><div><button id="refresh">Atualizar</button> <button id="logout">Sair</button></div></header><div id="layout"><aside><h3>Atendimentos</h3><div id="filters"></div><hr><small>Ambiente de testes · IA desativada</small><button id="demo">+ Criar conversa fictícia</button></aside><section id="inbox"><div><h3>Caixa de entrada</h3><input id="search" placeholder="Buscar nome ou curso"></div><div id="items"></div></section><section id="conversation"><div id="top"><h3 id="person">Selecione uma conversa</h3><small id="details"></small><div id="actions" hidden><select id="status"></select><select id="mode"><option value="humano">Humano</option><option value="ia">IA (planejada)</option></select><button id="tag">+ Etiqueta</button></div><div id="tags"></div></div><div id="history"></div><form id="compose" hidden><select id="kind"><option value="reply">Resposta ao candidato</option><option value="note">Nota interna</option></select><textarea id="message" required maxlength="10000" placeholder="Digite sua mensagem..."></textarea><button class="primary">Salvar mensagem</button><small>As respostas são armazenadas no banco; o chat público ainda não está conectado.</small></form></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
window.addEventListener('error', function(e){const n=document.getElementById('notice');n.textContent='Erro ao iniciar a central: '+(e.message||'falha ao carregar recurso');n.hidden=false;});
window.addEventListener('unhandledrejection', function(e){const n=document.getElementById('notice');n.textContent='Erro de conexão: '+(e.reason?.message||'falha inesperada');n.hidden=false;});
</script><script>
const SUPABASE_URL='https://ntcgtefarryunllhfiyr.supabase.co', KEY='sb_publishable_n2j2LW1DIV39H6v_zT8Lpw_aHcIcvpb';
if(!window.supabase) throw new Error('Biblioteca Supabase não carregou. Atualize a página e verifique a conexão.');
const $=id=>document.getElementById(id), db=window.supabase.createClient(SUPABASE_URL,KEY);let user, rows=[], selected=null, filter='all', timer, busy=false;const labels={all:'Todos',novo:'Novos leads',em_atendimento:'Em atendimento',aguardando:'Aguardando retorno',negociacao:'Em negociação',matriculado:'Matriculados',encerrado:'Encerrados'};
function notice(s){$('notice').textContent=s;$('notice').hidden=!s}function check(r){if(r.error)throw r.error;return r.data}function el(t,s,c){const n=document.createElement(t);n.textContent=s;if(c)n.className=c;return n}async function run(fn){try{await fn()}catch(e){notice(e.message||String(e))}}function reset(){clearInterval(timer);user=null;rows=[];selected=null;$('items').replaceChildren();$('history').replaceChildren();$('tags').replaceChildren();$('message').value='';$('details').textContent='';$('person').textContent='Selecione uma conversa';$('actions').hidden=$('compose').hidden=true;$('app').hidden=true;$('login').hidden=false;}
async function start(session){if(!session){reset();return}const p=check(await db.from('consultores').select('id,nome,cargo,ativo').eq('id',session.user.id).maybeSingle());if(!p||!p.ativo||p.cargo!=='admin'){await db.auth.signOut();reset();throw Error('Acesso não autorizado.')}user=p;$('who').textContent=p.nome+' · Administrador';$('login').hidden=true;$('app').hidden=false;await load();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden&&!busy)run(load)},10000)}
$('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{notice('');const b=e.target.querySelector('button');b.disabled=true;b.textContent='Entrando...';try{const d=check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await start(d.session)}finally{b.disabled=false;b.textContent='Entrar'}})};$('logout').onclick=()=>run(async()=>{check(await db.auth.signOut());reset();notice('')});$('refresh').onclick=()=>run(load);
async function load(){if(!user||busy)return;busy=true;try{rows=check(await db.from('conversas').select('*,candidatos(*)').order('ultima_mensagem_em',{ascending:false}).limit(200));render();if(selected&&rows.some(r=>r.id===selected))await detail(selected);else if(selected){selected=null;$('actions').hidden=$('compose').hidden=true;$('history').replaceChildren();$('tags').replaceChildren();$('person').textContent='Selecione uma conversa';$('details').textContent=''}}finally{busy=false}}
function render(){ $('filters').replaceChildren();for(const [k,v] of Object.entries(labels)){const b=el('button',v+' · '+rows.filter(r=>k==='all'||r.status===k).length,k===filter?'active':'');b.onclick=()=>{filter=k;render()};$('filters').append(b)}$('items').replaceChildren();const q=$('search').value.toLowerCase();for(const r of rows.filter(r=>(filter==='all'||r.status===filter)&&((r.candidatos?.nome||'')+' '+(r.candidatos?.curso_interesse||'')).toLowerCase().includes(q))){const b=el('button','', 'item '+(r.id===selected?'active':''));b.append(el('strong',r.candidatos?.nome||'Visitante'),el('small',r.candidatos?.curso_interesse||'Curso não informado'),el('span',labels[r.status]||r.status,'pill'));b.onclick=()=>run(async()=>{selected=r.id;render();await detail(r.id)});$('items').append(b)}if(!$('items').children.length)$('items').append(el('p','Nenhuma conversa encontrada.','item'))} $('search').oninput=render;
for(const [k,v] of Object.entries(labels))if(k!=='all')$('status').append(new Option(v,k));async function detail(id){const r=rows.find(x=>x.id===id);if(!r)return;const [m,n,t]=await Promise.all([db.from('mensagens').select('*').eq('conversa_id',id).order('criado_em').limit(500),db.from('notas_internas').select('*').eq('conversa_id',id).order('criado_em'),db.from('etiquetas').select('*').eq('conversa_id',id)]);const messages=check(m),notes=check(n),tags=check(t);if(selected!==id)return;$('person').textContent=r.candidatos?.nome||'Visitante';$('details').textContent=[r.candidatos?.curso_interesse,r.candidatos?.modalidade,r.candidatos?.telefone].filter(Boolean).join(' · ');$('actions').hidden=$('compose').hidden=false;$('status').value=r.status;$('mode').value=r.modo;$('tags').replaceChildren(...tags.map(x=>el('span',x.nome,'pill')));const h=$('history'),bottom=h.scrollHeight-h.scrollTop-h.clientHeight<60;h.replaceChildren();for(const x of [...messages,...notes.map(x=>({...x,remetente:'nota interna'}))].sort((a,b)=>a.criado_em.localeCompare(b.criado_em))){const b=el('div','','bubble '+(x.remetente==='nota interna'?'note':x.remetente==='candidato'?'':'out'));b.append(el('small',x.remetente+' · '+new Date(x.criado_em).toLocaleString('pt-BR')),el('div',x.conteudo));h.append(b)}if(bottom)h.scrollTop=h.scrollHeight}
async function update(fields){if(!selected)return;check(await db.from('conversas').update(fields).eq('id',selected));await load()}$('status').onchange=()=>run(()=>update({status:$('status').value,encerrado_em:$('status').value==='encerrado'?new Date().toISOString():null}));$('mode').onchange=()=>run(()=>update({modo:$('mode').value,consultor_id:$('mode').value==='humano'?user.id:null}));$('tag').onclick=()=>run(async()=>{const id=selected,nome=prompt('Nome da etiqueta');if(!id||!nome?.trim())return;check(await db.from('etiquetas').insert({conversa_id:id,nome:nome.trim()}));await load()});$('compose').onsubmit=e=>{e.preventDefault();run(async()=>{const id=selected,conteudo=$('message').value.trim(),b=e.target.querySelector('button');if(!id||!conteudo)return;b.disabled=true;try{const note=$('kind').value==='note';check(await db.from(note?'notas_internas':'mensagens').insert({conversa_id:id,consultor_id:user.id,conteudo,...(note?{}:{remetente:'consultor'})}));$('message').value='';await load()}finally{b.disabled=false}})};
$('demo').onclick=()=>run(async()=>{if(!confirm('Criar candidato e conversa fictícios para teste?'))return;const c=check(await db.from('candidatos').insert({nome:'Candidato fictício '+new Date().toLocaleTimeString('pt-BR'),curso_interesse:'Odontologia',origem:'teste'}).select('id').single());const r=check(await db.from('conversas').insert({candidato_id:c.id,modo:'humano',consultor_id:user.id}).select('id').single());check(await db.from('mensagens').insert({conversa_id:r.id,remetente:'candidato',conteudo:'Olá! Gostaria de saber mais sobre Odontologia. (Mensagem de teste)'}));selected=r.id;filter='all';await load()});run(async()=>start(check(await db.auth.getSession()).session));
</script></body></html>
